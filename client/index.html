<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Ordre des Cendres</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='6' y='5' width='4' height='7' fill='%23d9822b'/%3E%3Crect x='7' y='3' width='2' height='2' fill='%23f2c46d'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bone: #c9c0b4;
        --ash: #8d847a;
        --ember: #d9822b;
        --ember-light: #f2c46d;
        --blood: #c0583f;
        --panel: rgba(8, 7, 7, 0.86);
        --line: #3a332d;
        --serif: 'Cormorant Garamond', 'EB Garamond', Garamond, 'Times New Roman', serif;
        --mono: ui-monospace, 'DejaVu Sans Mono', monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--bone);
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        outline: none;
      }
      [hidden] {
        display: none !important;
      }
      .overlay {
        position: fixed;
        font: 12px/1.45 var(--mono);
        color: var(--bone);
        pointer-events: none;
        white-space: pre;
      }
      #debug {
        top: 12px;
        left: 12px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        display: none;
      }
      #hint {
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--ash);
        transition: opacity 1.2s ease;
      }
      #hud {
        bottom: 14px;
        right: 14px;
        color: var(--ash);
        font-size: 12px;
      }
      #nameplates {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .nameplate {
        position: absolute;
        left: 0;
        top: 0;
        font: 600 15px/1 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.04em;
        color: var(--bone);
        text-shadow:
          0 0 3px #000,
          0 1px 2px #000;
        white-space: nowrap;
        will-change: transform;
      }
      .nameplate.local {
        color: var(--ember-light);
      }
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(40, 24, 12, 0.55),
          rgba(0, 0, 0, 0.94) 70%
        );
      }
      .menu-panel {
        width: min(360px, calc(100vw - 32px));
        padding: 28px 28px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        text-align: center;
        font: 15px/1.4 var(--serif);
      }
      .menu-panel h1 {
        margin: 0 0 4px;
        font: 600 30px/1.1 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.06em;
        color: var(--bone);
      }
      .menu-panel .subtitle {
        margin: 0 0 22px;
        color: var(--ash);
        font-style: italic;
      }
      .menu-panel label {
        display: block;
        text-align: left;
        color: var(--ash);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .menu-panel input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        background: #0d0b0a;
        border: 1px solid var(--line);
        color: var(--bone);
        font: 16px var(--serif);
      }
      .menu-panel input:focus,
      .menu-panel button:focus-visible {
        outline: 1px solid var(--ember);
        outline-offset: 1px;
      }
      .menu-panel button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #1c1410;
        border: 1px solid #5a3a22;
        color: var(--bone);
        font: 600 16px var(--serif);
        letter-spacing: 0.03em;
        cursor: pointer;
      }
      .menu-panel button:hover:not(:disabled) {
        background: #2a1b12;
        border-color: var(--ember);
      }
      .menu-panel button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .menu-panel button.secondary {
        background: transparent;
        border-color: var(--line);
        color: var(--ash);
      }
      .menu-join {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .menu-join input {
        flex: 1;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        text-align: center;
      }
      .menu-join button {
        width: auto;
        margin-top: 0;
        padding: 0 16px;
      }
      .menu-separator {
        margin: 16px 0 6px;
        color: var(--ash);
        font-size: 13px;
      }
      #menu-status {
        min-height: 1.4em;
        margin: 14px 0 0;
        color: var(--ash);
        font-size: 14px;
      }
      #menu-status.error,
      #menu-share.error {
        color: var(--blood);
      }
      #menu-share {
        margin: 6px 0 0;
        color: var(--ash);
        font: 13px/1.4 var(--mono);
        user-select: all;
      }
      .menu-panel button.primary {
        background: #2a160c;
        border-color: var(--ember);
      }
      #duel-hud {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: min(860px, calc(100vw - 32px));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 18px;
        align-items: start;
        pointer-events: none;
        font-family: var(--serif);
      }
      .fighter {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .fighter.right {
        align-items: flex-end;
      }
      .fighter-name {
        font: 600 17px/1 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.04em;
        color: var(--bone);
        text-shadow: 0 1px 2px #000;
      }
      .fighter.local .fighter-name {
        color: var(--ember-light);
      }
      .fighter.empty {
        opacity: 0.35;
      }
      .bar {
        position: relative;
        width: 100%;
        height: 12px;
        background: rgba(10, 8, 8, 0.85);
        border: 1px solid #5a4636;
        overflow: hidden;
      }
      .bar .trail,
      .bar .fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
      }
      .fighter.right .bar .trail,
      .fighter.right .bar .fill {
        left: auto;
        right: 0;
      }
      .bar .trail {
        background: #8c2a1c;
      }
      .bar .fill {
        background: linear-gradient(#e9b768, #b9682a);
      }
      .ash {
        position: relative;
        width: 62%;
        height: 5px;
        background: rgba(10, 8, 8, 0.85);
        border: 1px solid #4a3a2c;
        overflow: hidden;
      }
      .ash .ash-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(90deg, #5a2410, #c8561e);
      }
      .fighter.right .ash .ash-fill {
        left: auto;
        right: 0;
      }
      .fighter.ash-full .ash {
        border-color: #e08a3a;
        animation: ash-pulse 0.9s ease-in-out infinite alternate;
      }
      .fighter.ash-full .ash .ash-fill {
        background: linear-gradient(90deg, #e0702a, #ffd07a);
      }
      @keyframes ash-pulse {
        from {
          box-shadow: 0 0 2px rgba(255, 150, 60, 0.4);
        }
        to {
          box-shadow: 0 0 9px rgba(255, 150, 60, 0.95);
        }
      }
      .ash-ready {
        min-height: 12px;
        font: 600 12px/1 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.05em;
        color: var(--ember-light);
        text-shadow:
          0 0 6px rgba(217, 130, 43, 0.7),
          0 1px 2px #000;
      }
      #duel-hud.training #fighter-right,
      #duel-hud.training .round-info,
      #duel-hud.training .pips {
        visibility: hidden;
      }
      .pips {
        color: var(--ember-light);
        font: 14px/1 var(--mono);
        letter-spacing: 0.1em;
      }
      .round-info {
        text-align: center;
        min-width: 70px;
      }
      #duel-timer {
        font: 600 30px/1 var(--serif);
        color: var(--bone);
        text-shadow: 0 1px 3px #000;
      }
      #duel-round {
        margin-top: 2px;
        color: var(--ash);
        font: 13px/1.2 var(--serif);
        font-variant: small-caps;
      }
      .hit-text {
        position: absolute;
        transform: translate(-50%, -50%);
        font: 600 20px/1 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.05em;
        color: var(--ember-light);
        text-shadow:
          0 0 8px rgba(217, 130, 43, 0.7),
          0 1px 2px #000;
        white-space: nowrap;
        pointer-events: none;
        animation: hit-text-rise 0.9s ease-out forwards;
      }
      .hit-text.steel {
        color: #dfe8f5;
        text-shadow:
          0 0 8px rgba(150, 185, 235, 0.75),
          0 1px 2px #000;
      }
      .hit-text.ash {
        color: #c9c2b6;
        text-shadow:
          0 0 6px rgba(200, 190, 170, 0.5),
          0 1px 2px #000;
      }
      @keyframes hit-text-rise {
        0% {
          opacity: 0;
          margin-top: 6px;
          scale: 0.7;
        }
        15% {
          opacity: 1;
          scale: 1.15;
        }
        100% {
          opacity: 0;
          margin-top: -34px;
          scale: 1;
        }
      }
      #banner {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        white-space: nowrap;
      }
      #banner-title {
        font: 600 56px/1.05 var(--serif);
        font-variant: small-caps;
        letter-spacing: 0.06em;
        color: var(--bone);
        text-shadow:
          0 0 18px rgba(217, 130, 43, 0.45),
          0 2px 4px #000;
      }
      #banner-subtitle {
        margin-top: 8px;
        font: 18px/1.3 var(--serif);
        color: var(--ash);
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="nameplates"></div>
    <div id="debug" class="overlay"></div>
    <div id="hud" class="overlay" hidden></div>
    <div id="hint" class="overlay" hidden>F1 : contrôles et debug</div>
    <div id="duel-hud" hidden>
      <div id="fighter-left" class="fighter left">
        <div class="fighter-name"></div>
        <div class="bar">
          <div class="trail"></div>
          <div class="fill"></div>
        </div>
        <div class="ash"><div class="ash-fill"></div></div>
        <div class="pips"></div>
        <div class="ash-ready"></div>
      </div>
      <div class="round-info">
        <div id="duel-timer"></div>
        <div id="duel-round"></div>
      </div>
      <div id="fighter-right" class="fighter right">
        <div class="fighter-name"></div>
        <div class="bar">
          <div class="trail"></div>
          <div class="fill"></div>
        </div>
        <div class="ash"><div class="ash-fill"></div></div>
        <div class="pips"></div>
        <div class="ash-ready"></div>
      </div>
    </div>
    <div id="banner" hidden>
      <div id="banner-title"></div>
      <div id="banner-subtitle"></div>
    </div>
    <div id="menu">
      <div class="menu-panel">
        <h1>L'Ordre des Cendres</h1>
        <p class="subtitle">Duels de chevaliers maudits, qui ne meurent jamais vraiment.</p>
        <label for="menu-name">Ton nom</label>
        <input id="menu-name" autocomplete="off" spellcheck="false" placeholder="Chevalier" />
        <button id="menu-quick" class="primary" type="button">Combat rapide</button>
        <button id="menu-create" type="button">Duel privé</button>
        <div class="menu-separator">ou rejoindre un duel avec son code</div>
        <div class="menu-join">
          <input id="menu-code" autocomplete="off" spellcheck="false" placeholder="CODE" />
          <button id="menu-join" type="button">Rejoindre</button>
        </div>
        <button id="menu-training" class="secondary" type="button">Entraînement</button>
        <p id="menu-status" role="status"></p>
        <p id="menu-share"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
